name: Kiosk Linux touch and zoom

on:
  push:
    branches: [KioskoJsEMR]
    paths:
      - 'app/src-tauri/**'
      - '.github/workflows/kiosk-linux.yml'
  pull_request:
    paths:
      - 'app/src-tauri/**'
      - '.github/workflows/kiosk-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GTK and WebKit development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config xvfb
      - name: Select Rust stable
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build frontend assets
        run: npm run setup && npm run build
      - name: Compile native app and test real GTK gesture controllers
        run: xvfb-run -a cargo test --locked --manifest-path app/src-tauri/Cargo.toml --lib linux_touch::tests -- --test-threads=1
