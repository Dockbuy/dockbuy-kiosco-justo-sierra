[package]
name = "dockbuy-justo-sierra"
version = "0.1.0"
edition = "2021"
[lib]
name = "dockbuy_justo_sierra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "linux-touch"
path = "tests/linux_touch.rs"
# GTK/WebKit deben inicializarse y cerrarse en main, no en un hilo de libtest.
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "~2.12", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# Coinciden con las versiones de Tauri/Wry en Cargo.lock (GTK 3 / WebKit 4.1).
gtk = "0.18"
webkit2gtk = "2.0"
